name: Build Android APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable APK
        run: gradle :android-app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-app/build/outputs/apk/debug/android-app-debug.apk Khalsa-Syllabus-Tracker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Khalsa-Syllabus-Tracker-APK
          path: Khalsa-Syllabus-Tracker.apk
          if-no-files-found: error
